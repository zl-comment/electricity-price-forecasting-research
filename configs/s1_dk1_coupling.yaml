data:
  root: data/multi_market_energy_reserve/energinet_dk1
  primary_price_area: DK1

protocol:
  random_seed: 1
  civil_timezone: Europe/Copenhagen

window:
  first_delivery_day: "2025-10-01"
  last_delivery_day: "2026-08-28"
  excluded_delivery_days:
    - "2025-11-22"
    - "2025-11-23"
    - "2025-11-24"
    - "2026-08-25"

split:
  calibration_days: 84
  probability_calibration_days: 28
  clearing_days: 7
  first_test_delivery_day: "2026-01-28"

storage:
  reference_pv_plant_mwp: 20.0
  round_trip_efficiency: 0.85
  reserve_delivery_hours: 1.0
  commitment_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
  arms:
    main:
      capacity_fraction: 0.20
      power_mw: 4.0
      energy_mwh: 8.0
      market_share_cap: 1.0
    sensitivity:
      capacity_fraction: 0.50
      power_mw: 10.0
      energy_mwh: 20.0
      market_share_cap: 0.10

datasets:
  day_ahead_prices:
    csv: day_ahead_prices.csv
    metadata: day_ahead_prices_metadata.json
    time_column: TimeUTC
    local_time_column: TimeDK
    key_columns: [TimeUTC, PriceArea]
    price_areas: [DK1, DK2, DE, NO2, SE3, SE4]
    declared_resolution: PT15M
    declared_update_frequency: P1D
    value_columns: [DayAheadPriceEUR, DayAheadPriceDKK]
  afrr_capacity_market:
    csv: afrr_capacity_market.csv
    metadata: afrr_capacity_market_metadata.json
    time_column: TimeUTC
    local_time_column: TimeDK
    key_columns: [TimeUTC, PriceArea]
    price_areas: [DK1]
    declared_resolution: PT1H
    declared_update_frequency: P1D
    value_columns: [UpDemandMW, UpProcuredMW, UpPriceEUR, DownDemandMW, DownProcuredMW, DownPriceEUR]
  imbalance_and_activation:
    csv: imbalance_and_activation.csv
    metadata: imbalance_and_activation_metadata.json
    time_column: TimeUTC
    local_time_column: TimeDK
    key_columns: [TimeUTC, PriceArea]
    price_areas: [DK1]
    declared_resolution: PT15M
    declared_update_frequency: PT15M
    value_columns: [aFRRUpMW, aFRRVWAUpEUR]
  production_consumption_settlement:
    csv: production_consumption_settlement.csv
    metadata: production_consumption_settlement_metadata.json
    time_column: HourUTC
    local_time_column: HourDK
    key_columns: [HourUTC, PriceArea]
    price_areas: [DK1]
    declared_resolution: PT1H
    declared_update_frequency: P1D
    value_columns: [GrossConsumptionMWh]

net_load:
  consumption_column: GrossConsumptionMWh
  wind_columns:
    - OffshoreWindLt100MW_MWh
    - OffshoreWindGe100MW_MWh
    - OnshoreWindLt50kW_MWh
    - OnshoreWindGe50kW_MWh
  solar_columns:
    - SolarPowerLt10kW_MWh
    - SolarPowerGe10Lt40kW_MWh
    - SolarPowerGe40kW_MWh
    - SolarPowerSelfConMWh

stress_scenarios:
  lookback_only: true
  reserve_price_spike_quantile: 0.90
  activation_intensity_quantile: 0.90
  net_load_high_quantile: 0.90
  net_load_low_quantile: 0.10

acceptance:
  min_days_with_reserve_dominant: 1
  min_days_with_energy_dominant: 1
  max_zero_crowd_out_day_share: 0.99

output:
  directory: p1_paper/results/s1_dk1_coupling
  summary_json: summary.json
  crowd_out_csv: crowd_out_daily.csv
  activation_csv: activation_daily.csv
