base_config: configs/s3_forecast_side.yaml
cross_market_config: configs/s3_cross_market.yaml
storage_config: configs/s2c_decision_layer.yaml

references:
  s2_baseline_summary: p1_paper/results/s2_dk1_baselines/summary.json
  s2c_summary: p1_paper/results/s2c_decision_layer/summary.json

acceptance:
  oracle_relative_tolerance: 0.001
  settlement_absolute_tolerance_eur: 0.000001

storage:
  arm: main
  initial_soc_mwh: 4.4
  terminal_soc_mwh: 4.4
  reserve_delivery_hours: 1.0

solver:
  method: highs
  status4_retry:
    - label: highs_ipm
      method: highs-ipm
      options: {}
    - label: highs_ipm_presolve_off
      method: highs-ipm
      options: {presolve: false}
    - label: highs_tolerance_1e-9
      method: highs
      options: {primal_feasibility_tolerance: 1.0e-9, dual_feasibility_tolerance: 1.0e-9}
  status4_retry_reason: >-
    The 2026-09-15 full run fell back to the persistence-threshold baseline on 21.5% of
    weather-augmented and 10% of gate-conditioned joint-scenario days, all HiGHS status 4
    (optimal in the scaled model, not confirmed unscaled),
    none infeasible or timed out. Re-solving the identical LP in this order solved 122 of 128
    failing cases and left objectives unchanged (relative difference at most 2e-10) on 24
    reference cases. Only status 4 triggers a retry; infeasible or timed-out solves still use B1.
  time_limit_seconds: 300.0
  objective_scale_eur: 100.0
  max_fallback_share: 0.05
  fallback_arm: B1
  exclusivity_tolerance_mw: 0.000001
  soc_tolerance_mwh: 0.000001
  recovery_constraint_tolerance_mwh: 0.000000001
  objective_tolerance_eur: 0.000001

risk:
  chi_levels: [0.0, 0.5]
  cvar_level: 0.95
  x14_chi_levels: [0.0, 0.1, 0.5]

recourse:
  delivery_0730: full
  delivery_1200: delivery_first
  shortfall_sensitivity: economic
  delivery_tolerance_mwh: 0.000000001
  premium_sampling_seed: 1

tree:
  clusters: 10
  seed: 1
  n_init: 10

premium_availability:
  kind: next_danish_bank_day_publication
  publication_civil_time: "15:00"
  civil_timezone: Europe/Copenhagen
  working_weekdays: [0, 1, 2, 3, 4]
  holidays:
    - "2025-12-24"
    - "2025-12-25"
    - "2025-12-26"
    - "2025-12-31"
    - "2026-01-01"
    - "2026-04-02"
    - "2026-04-03"
    - "2026-04-06"
    - "2026-05-14"
    - "2026-05-15"
    - "2026-05-25"
    - "2026-06-05"
  sources:
    - https://danskebank.com/-/media/pdf/danskeci-com/seasonal-messages/bank-holidays.pdf?rev=99d3cdf587e343d39a752346c0c5275b
    - https://www.nationalbanken.dk/en/what-we-do/stable-prices-monetary-policy-and-the-danish-economy/bank-holidays

export:
  sampling_seed: 1
  generated_scenario_count: 100
  saved_scenario_count: 50
  score_tolerance: 0.000000001
  source_config: configs/s3_cross_market.yaml
  scenario_0730_sources:
    pooled_independent: own_pooled__independent
    pooled_gaussian: own_pooled__gaussian
    pooled_gaussian_no_cross_target: own_pooled__gaussian_no_cross_target
    pooled_empirical: own_pooled__empirical
  scenario_1200_sources:
    pooled_gaussian__gaussian_24_hour: own_pooled__gaussian_24_hour
    pooled_empirical__analog: own_pooled__analog
    direct_quantile_regression: own_pooled__direct_quantile_regression
  point_1200_id: fb0_lgbm_cap1200

evaluation:
  bootstrap_block_days: 7
  bootstrap_repetitions: 2000
  bootstrap_confidence_level: 0.95
  bootstrap_seed: 1
  dm_newey_west_lags: 6
  dm_sidedness: two_sided
  stress_capacity_price_eur_per_mw: 56.53
  stress_activation_volume_mwh_per_hour: 38.70

midday_evening_analysis:
  proxy_config: configs/s1_dk1_coupling.yaml
  midday_start_hour: 10
  midday_end_hour_exclusive: 16
  evening_start_hour: 17
  evening_end_hour_exclusive: 22
  aggregation_tolerance: 0.000001
  proxy_decomposition:
    exchange_columns:
      - ExchangeNO_MWh
      - ExchangeSE_MWh
      - ExchangeGE_MWh
      - ExchangeNL_MWh
      - ExchangeGB_MWh
      - ExchangeGreatBelt_MWh
    conventional_columns:
      - CentralPowerMWh
      - LocalPowerMWh
      - CommercialPowerMWh
      - LocalPowerSelfConMWh
      - HydroPowerMWh
      - UnknownProdMWh
    power_to_heat_column: PowerToHeatMWh
    balance_tolerance_mwh: 0.00002
  gate_proxy_forecast:
    weather_csv: data/multi_market_energy_reserve/open_meteo_dk1/ecmwf_gate_weather.csv
    weather_metadata: data/multi_market_energy_reserve/open_meteo_dk1/ecmwf_gate_weather_metadata.json
    gates: [gate_0730, gate_1200]
    maximum_publication_latency_hours: 6
    expected_grid_points: 9
    weather_columns:
      - temperature_2m_c_mean
      - wind_speed_100m_ms_mean
      - wind_speed_100m_ms_std
      - shortwave_radiation_wm2_mean
      - cloud_cover_pct_mean
    temperature_column: temperature_2m_c_mean
    wind_speed_column: wind_speed_100m_ms_mean
    fourier_harmonics: 4
    lag_days: [7, 14]
    settlement_observation_lag_minutes: 4545
    minimum_training_rows: 1440
    targets: [wind_mwh, solar_mwh, gross_consumption_mwh]
    target_forecast_columns:
      wind_mwh: forecast_wind_mwh
      solar_mwh: forecast_solar_mwh
      gross_consumption_mwh: forecast_gross_consumption_mwh
  proxy_aware_decision:
    early_scenario_source: pooled_gaussian
    late_scenario_source: null
    delivery_mode: full
    risk_weight: 0.0
    strategies:
      - {strategy: B3_proxy_rho25, alignment_credit_eur_per_mwh: 25.0}
      - {strategy: B3_proxy_rho50, alignment_credit_eur_per_mwh: 50.0}
      - {strategy: B3_proxy_rho100, alignment_credit_eur_per_mwh: 100.0}
  trace_arms:
    - {strategy: B2_FB0, chi: 0.0, file: b2_fb0_chi0.csv}
    - {strategy: B2_FB0_gate, chi: 0.0, file: b2_fb0_gate_chi0.csv}
    - {strategy: B3_hist_paired, chi: 0.0, file: b3_hist_paired_chi0.csv}
    - {strategy: B3_hist_paired, chi: 0.5, file: b3_hist_paired_chi05.csv}
    - {strategy: B3_pooled_gaussian, chi: 0.0, file: b3_pooled_gaussian_chi0.csv}
    - {strategy: B3_pooled_gaussian, chi: 0.5, file: b3_pooled_gaussian_chi05.csv}
    - {strategy: X06_rebuild, chi: 0.0, file: x06_rebuild_chi0.csv}
    - {strategy: X09_rebuild, chi: 0.0, file: x09_rebuild_chi0.csv}
    - {strategy: X14_rebuild, chi: 0.0, file: x14_rebuild_chi0.csv}
    - {strategy: B3_proxy_rho25, chi: 0.0, file: b3_proxy_rho25_chi0.csv}
    - {strategy: B3_proxy_rho50, chi: 0.0, file: b3_proxy_rho50_chi0.csv}
    - {strategy: B3_proxy_rho100, chi: 0.0, file: b3_proxy_rho100_chi0.csv}
  paired_comparisons:
    - {strategy: B3_hist_paired, chi: 0.0, comparator: B2_FB0_gate, comparator_chi: 0.0}
    - {strategy: B3_hist_paired, chi: 0.5, comparator: B3_hist_paired, comparator_chi: 0.0}
    - {strategy: B3_pooled_gaussian, chi: 0.0, comparator: B3_hist_paired, comparator_chi: 0.0}
    - {strategy: X06_rebuild, chi: 0.0, comparator: B2_FB0_gate, comparator_chi: 0.0}
    - {strategy: X09_rebuild, chi: 0.0, comparator: B2_FB0_gate, comparator_chi: 0.0}
    - {strategy: X14_rebuild, chi: 0.0, comparator: B2_FB0_gate, comparator_chi: 0.0}
    - {strategy: B3_proxy_rho25, chi: 0.0, comparator: B3_pooled_gaussian, comparator_chi: 0.0}
    - {strategy: B3_proxy_rho50, chi: 0.0, comparator: B3_pooled_gaussian, comparator_chi: 0.0}
    - {strategy: B3_proxy_rho100, chi: 0.0, comparator: B3_pooled_gaussian, comparator_chi: 0.0}

arms:
  b2: [B2_FB0, B2_FB0_gate]
  b3:
    - B3_hist_paired
    - B3_hist_independent
    - B3_pooled_independent
    - B3_pooled_gaussian_no_cross
    - B3_pooled_gaussian
    - B3_pooled_gaussian_gate
    - B3_pooled_gaussian_directqr
    - B3_pooled_empirical
    - B3_pooled_empirical_analog
    - B3_pooled_empirical_directqr
    - B3_fb2_s3a
    - B3_fb2_plus_weather_s3a
    - B3_hist_paired_shortfall
  published: [X14_rebuild, X07_rebuild, X09_rebuild, X06_rebuild, X13_rebuild]

reporting:
  method_names:
    B0: Energy-arbitrage-only persistence baseline
    B1: Persistence-price threshold-reserve baseline
    B2_F01: LEAR point-forecast deterministic dispatch
    B2_F08: LightGBM point-forecast reference dispatch
    B2_FB0: LightGBM point-forecast same-protocol dispatch
    B2_FB0_gate: Gate-updated LightGBM point-forecast dispatch
    B3_fb2_plus_weather_s3a: Weather-augmented gate-conditioned joint-scenario dispatch
    B3_fb2_s3a: Gate-conditioned joint-scenario stochastic dispatch
    B3_hist_independent: Historical independent-scenario stochastic dispatch
    B3_hist_paired: Historical paired-scenario stochastic dispatch
    B3_hist_paired_shortfall: Historical paired-scenario economic-shortfall dispatch
    B3_pooled_empirical: Pooled empirical-copula stochastic dispatch
    B3_pooled_empirical_analog: Pooled empirical-copula analog-updated dispatch
    B3_pooled_empirical_directqr: Pooled empirical-copula direct-quantile-updated dispatch
    B3_pooled_gaussian: Pooled Gaussian-copula stochastic dispatch
    B3_pooled_gaussian_directqr: Pooled Gaussian-copula direct-quantile-updated dispatch
    B3_pooled_gaussian_gate: Pooled Gaussian-copula gate-conditioned dispatch
    B3_pooled_gaussian_no_cross: Pooled Gaussian-copula dispatch without cross-target dependence
    B3_pooled_independent: Pooled independent-scenario stochastic dispatch
    B3_proxy_rho25: Proxy-aligned pooled Gaussian-copula dispatch (rho=25 EUR/MWh)
    B3_proxy_rho50: Proxy-aligned pooled Gaussian-copula dispatch (rho=50 EUR/MWh)
    B3_proxy_rho100: Proxy-aligned pooled Gaussian-copula dispatch (rho=100 EUR/MWh)
    Oracle: Perfect-information dispatch upper bound
    X06_rebuild: Data-driven deterministic-scenario reserve reconstruction
    X07_rebuild: Static empirical-copula virtual-power-plant reconstruction
    X09_rebuild: Sequential block-copula stochastic reconstruction
    X13_rebuild: Delivery-guarantee battery reserve reconstruction
    X14_rebuild: Wind-battery historical-scenario cluster reconstruction
    oracle_price_reserve: Perfect-price reserve dispatch

published_rules:
  extraction_fields:
    - decision_stages
    - decision_variables
    - objective_terms
    - soc_and_reserve_duration
    - activation_representation
    - nonanticipativity
    - risk_measure
    - scenario_count
    - binary_variables
    - removed_assets
    - market_product_differences
    - original_evaluation
  x06:
    execution: rebuild
    epsilon: 0.2
    source: paper/multi_market_energy_reserve/01_intersection_frontier/01_top_journal_or_conference/X06_2021_TPWRS_Data_Driven_DA_Reserve.pdf
    sha256: 91fc2c14e804efb67f8ca75d394ee4815d0dc80e2dffc535590d65e9bab7e9b5
    source_locator:
      decision_stages: "PDF pp. 3-5, Sections II-III"
      decision_variables: "PDF pp. 3-5, equations (1)-(7)"
      objective_terms: "PDF p. 4, equations (3a)-(3b)"
      soc_and_reserve_duration: "PDF pp. 4-5, equations (4)-(7)"
      activation_representation: "PDF pp. 5-6, equations (8)-(12)"
      nonanticipativity: "PDF pp. 3-5, deterministic day-ahead schedule"
      risk_measure: "PDF pp. 5-6, joint chance constraint and equations (10)-(12)"
      scenario_count: "PDF pp. 7-8, Section IV"
      binary_variables: "PDF p. 4, charge/discharge state"
      removed_assets: "PDF pp. 3-4, storage-only formulation"
      market_product_differences: "PDF pp. 7-8, Belgian reserve case"
      original_evaluation: "PDF pp. 7-10, Sections IV-V"
    paper_value:
      decision_stages: deterministic day-ahead energy and reserve schedule
      decision_variables: energy schedule, reserve offer, SOC, delivery variables
      objective_terms: day-ahead energy and reserve revenue
      activation_representation: empirical activation uncertainty
      risk_measure: probabilistic real-time delivery guarantee
      binary_variables: charge/discharge exclusivity
      market_product_differences: Belgian energy and reserve products
      original_evaluation: Belgian historical case study
    dk1_value:
      risk_measure: "hourwise quantile approximation with epsilon 0.2"
      scenario_count: "50 climatology paths reduced to one quantile path"
      binary_variables: frozen gross-power relaxation
    deviation:
      - DK1 prices, product timing, feasible set, and settlement replace the Belgian protocol
      - epsilon 0.2 is task-frozen and not reported as the paper-selected value
      - joint delivery guarantee is approximated hourwise on frozen climatology paths
      - integer exclusivity is replaced by the common gross-power constraint
    undetermined: []
  x07:
    execution: skip
    source: paper/multi_market_energy_reserve/01_intersection_frontier/02_peer_reviewed_specialized/X07_SOURCE_2022_IEEE_Systems_VPP_Stochastic.md
    sha256: 192122191b675cb27d615e565bed4ef9aa84feb7bbed2e4b0977ba61cef536da
    source_locator:
      decision_stages: "PDF pp. 3-4, Section II"
      decision_variables: "PDF pp. 4-6, equations (3)-(18)"
      objective_terms: "PDF p. 4, equations (3)-(6)"
      soc_and_reserve_duration: "PDF pp. 5-6, storage constraints"
      activation_representation: "PDF pp. 3-4, Section II-A and Fig. 2"
      nonanticipativity: "PDF pp. 3-4, day-ahead offers common to scenarios"
      risk_measure: "PDF p. 6, CVaR equations; nomenclature gamma and beta"
      scenario_count: "PDF pp. 3 and 8, scenario generation and case study"
      binary_variables: "PDF pp. 1-2 and 5, unit and storage states"
      removed_assets: "PDF pp. 4-6, generators, renewables, demand response"
      market_product_differences: "PDF pp. 7-8, Belgian case study"
      original_evaluation: "PDF pp. 7-9, Section IV"
    paper_value:
      risk_measure: "beta mixes expectation and CVaR; gamma is CVaR confidence"
      binary_variables: unit commitment and charge/discharge states
      original_evaluation: Belgian VPP case study
    dk1_value: {}
    deviation: []
    undetermined:
      - CVaR confidence gamma
      - probabilities of the six retained scenarios
    skip_reason: decisive risk confidence and scenario weights are not reported
  x09:
    execution: rebuild
    source: paper/multi_market_energy_reserve/01_intersection_frontier/01_top_journal_or_conference/X09_2021_Applied_Energy_Sequential_Stochastic.pdf
    sha256: 98b2055a323b9dd4f1189d14eda0afb3f350ca53aa63d941fa990e82953cee4b
    source_locator:
      decision_stages: "PDF pp. 5-6 and 14-20, Sections 4.2 and 4.6"
      decision_variables: "PDF pp. 7-10, nomenclature and equations (1)-(37)"
      objective_terms: "PDF pp. 10-12, equations (1)-(5)"
      soc_and_reserve_duration: "PDF pp. 12-14, storage constraints"
      activation_representation: "PDF pp. 21-22, Section 5.1.3"
      nonanticipativity: "PDF pp. 5-6 and 14-20, Table 1"
      risk_measure: "PDF p. 27, risk excluded and listed as future work"
      scenario_count: "PDF p. 21, 3 x 10 x 3 equals 90"
      binary_variables: "PDF pp. 12-14, none required by convex model"
      removed_assets: "PDF pp. 6-14, wind farm"
      market_product_differences: "PDF pp. 5-6, DAM then balancing then reserve sequence"
      original_evaluation: "PDF pp. 20-26, 60-day Spanish wind-farm study"
    paper_value:
      decision_stages: sequential scenario update across DAM, balancing, and reserve markets
      nonanticipativity: earlier decisions fixed in later phases
      risk_measure: risk neutral
      scenario_count: 90
      removed_assets: wind farm
      original_evaluation: random 60-day Spanish case
    dk1_value:
      decision_stages: one 07:30 two-stage solve and frozen 12:00 re-solve
      scenario_count: 50
      removed_assets: wind farm removed
    deviation:
      - DK1 reverses the paper DAM-to-reserve sequence to reserve-at-07:30 then energy-at-12:00
      - 50 common scenarios replace the paper 90-scenario product tree
      - wind generation, intraday market, and down reserve are removed
    undetermined: []
  x13:
    execution: skip
    source: paper/multi_market_energy_reserve/01_intersection_frontier/02_peer_reviewed_specialized/X13_2024_EPSR_BESS_aFRR_Delivery_Guarantees.pdf
    sha256: 785d22d423f22bd60887d6357e5a882b84eb1461f42407ab895a0fab2dc49c1d
    source_locator:
      decision_stages: "PDF pp. 2-4, Section 2"
      decision_variables: "PDF pp. 2-4, equations (1)-(3)"
      objective_terms: "PDF pp. 2-3, equations (1a)-(1c)"
      soc_and_reserve_duration: "PDF pp. 3-4, storage constraints"
      activation_representation: "PDF pp. 3-4, random activation duration"
      nonanticipativity: "PDF pp. 2-4, deterministic schedule"
      risk_measure: "PDF pp. 3-4, equations (3a)-(3e)"
      scenario_count: "PDF p. 4, equation (3d)"
      binary_variables: "PDF pp. 2-3, operating-mode variables"
      removed_assets: "PDF pp. 2-4, storage-only formulation"
      market_product_differences: "PDF pp. 5-7, Belgian aFRR"
      original_evaluation: "PDF pp. 5-8, Sections 3-4"
    paper_value:
      risk_measure: joint chance constraint with random activation duration
      original_evaluation: Belgian DAM and aFRR case
    dk1_value: {}
    deviation: []
    undetermined:
      - objective treatment of random activation duration
      - consistent operational meaning of printed equation (3e)
    skip_reason: decisive duration treatment is not determined and equation (3e) is internally unclear
  x14:
    execution: rebuild
    source: paper/multi_market_energy_reserve/01_intersection_frontier/02_peer_reviewed_specialized/X14_SOURCE_2024_EEM_Wind_Battery_aFRR.md
    sha256: 470664f4149402996a54cf067996515f3c0f6eaae3f50ddc00b81a09f3da3a65
    source_locator:
      decision_stages: "PDF pp. 2-3 and 5-6, Fig. 1 and Appendix A-A"
      decision_variables: "PDF pp. 2-4 and 6-9, equations (1)-(2), (A.1)-(A.57)"
      objective_terms: "PDF pp. 3 and 6-7, equation (2a), (A.11)-(A.20)"
      soc_and_reserve_duration: "PDF pp. 3 and 8, 1.5 h and equations (A.54)-(A.55)"
      activation_representation: "PDF pp. 2-3, historical activation probability times 0.5"
      nonanticipativity: "PDF pp. 3 and 6, equations (A.1)-(A.10)"
      risk_measure: "PDF pp. 3-4 and 8-9, equations (2f)-(2h), (A.58)-(A.60)"
      scenario_count: "PDF pp. 2-3, Fig. 1 illustrative only"
      binary_variables: "PDF pp. 3 and 7-8, imbalance and operating-state binaries"
      removed_assets: "PDF pp. 2-4, 400 MW wind farm"
      market_product_differences: "PDF pp. 2-3 and 8, German 4-hour/PICASSO products"
      original_evaluation: "PDF pp. 4-5, 2022 German case studies"
    paper_value:
      decision_stages: multistage scenario tree
      objective_terms: wind-battery energy, capacity, activation, and imbalance revenue
      soc_and_reserve_duration: 1.5 hours
      activation_representation: historical probability times 0.5 average activation
      nonanticipativity: scenario-cluster equalities by information stage
      risk_measure: expectation-CVaR mixture
      scenario_count: undetermined
      binary_variables: wind imbalance direction and BESS operating states
      removed_assets: 400 MW wind farm
      market_product_differences: German four-hour capacity blocks and PICASSO activation
      original_evaluation: model revenue distributions on 2022 German data
    dk1_value:
      decision_stages: common 07:30 reserve, clustered energy, scenario recourse, then 12:00 re-solve
      objective_terms: common DK1 settlement ledger
      soc_and_reserve_duration: 1 hour
      activation_representation: "alpha_h from F(D), multiplied by 0.5"
      risk_measure: "chi in [0, 0.1, 0.5], CVaR level 0.95"
      scenario_count: 50 equal-weight scenarios
      binary_variables: frozen gross-power relaxation
      removed_assets: wind farm removed
      market_product_differences: hourly DK1 aFRR capacity and DK1 activation settlement
      original_evaluation: 211 out-of-sample DK1 delivery days
    deviation:
      - capacity prices sampled independently by hour from the same-hour F(D) observations
      - day-ahead and activation-price scenarios independently sample whole F(D) historical days
      - activation uses F(D) positive-slot frequency times 0.5
      - 50 equal weights and CVaR level 0.95 are task-authorised assumptions, not paper values
      - German 1.5-hour reserve duration is replaced by the frozen DK1 1-hour duration
      - wind farm and binary variables are removed under the common feasible set
    undetermined:
      - original alpha construction and training window
      - original clustering details
      - original scenario count and weights
      - original CVaR confidence
      - original day-ahead and activation-price path sampling unit

