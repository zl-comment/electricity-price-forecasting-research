data:
  root: data/multi_market_energy_reserve/energinet_dk1
  primary_price_area: DK1

protocol:
  random_seed: 1
  timezone: UTC

datasets:
  day_ahead_prices:
    csv: day_ahead_prices.csv
    metadata: day_ahead_prices_metadata.json
    time_column: TimeUTC
    local_time_column: TimeDK
    key_columns: [TimeUTC, PriceArea]
    price_areas: [DK1, DK2, DE, NO2, SE3, SE4]
    declared_resolution: PT15M
    declared_update_frequency: P1D
    value_columns: [DayAheadPriceEUR, DayAheadPriceDKK]
  afrr_capacity_market:
    csv: afrr_capacity_market.csv
    metadata: afrr_capacity_market_metadata.json
    time_column: TimeUTC
    local_time_column: TimeDK
    key_columns: [TimeUTC, PriceArea]
    price_areas: [DK1]
    declared_resolution: PT1H
    declared_update_frequency: P1D
    value_columns:
      - UpDemandMW
      - UpProcuredMW
      - UpPriceEUR
      - DownDemandMW
      - DownProcuredMW
      - DownPriceEUR
  imbalance_and_activation:
    csv: imbalance_and_activation.csv
    metadata: imbalance_and_activation_metadata.json
    time_column: TimeUTC
    local_time_column: TimeDK
    key_columns: [TimeUTC, PriceArea]
    price_areas: [DK1]
    declared_resolution: PT15M
    declared_update_frequency: PT15M
    value_columns:
      - SatisfiedDemand
      - ImbalancePriceEUR
      - SpotPriceEUR
      - DominatingDirection
      - aFRRUpMW
      - aFRRDownMW
      - aFRRVWAUpEUR
      - aFRRVWADownEUR
  wind_solar_forecasts:
    csv: wind_solar_forecasts.csv
    metadata: wind_solar_forecasts_metadata.json
    time_column: HourUTC
    local_time_column: HourDK
    key_columns: [HourUTC, PriceArea, ForecastType]
    price_areas: [DK1]
    declared_resolution: PT1H
    declared_update_frequency: PT5M
    value_columns:
      - ForecastDayAhead
      - ForecastIntraday
      - Forecast5Hour
      - Forecast1Hour
      - ForecastCurrent
  production_consumption_settlement:
    csv: production_consumption_settlement.csv
    metadata: production_consumption_settlement_metadata.json
    time_column: HourUTC
    local_time_column: HourDK
    key_columns: [HourUTC, PriceArea]
    price_areas: [DK1]
    declared_resolution: PT1H
    declared_update_frequency: P1D
    value_columns:
      - OffshoreWindGe100MW_MWh
      - OnshoreWindGe50kW_MWh
      - SolarPowerGe40kW_MWh
      - GrossConsumptionMWh

resolution_seconds:
  PT15M: 900
  PT1H: 3600

daylight_saving:
  civil_timezone: Europe/Copenhagen
  switch_instants_utc:
    - "2025-10-26 01:00:00"
    - "2026-03-29 01:00:00"

civil_timezone: Europe/Copenhagen

gates:
  reserve_capacity:
    civil_time: "07:30"
    delivery_day_offset: -1
    assert_no_delivery_day_coverage: true
  day_ahead_energy:
    civil_time: "12:00"
    delivery_day_offset: -1

visibility:
  day_ahead_prices:
    kind: daily_publication
    civil_time: "12:57"
    delivery_day_offset: -1
  afrr_capacity_market:
    kind: daily_publication
    civil_time: "09:20"
    delivery_day_offset: -1
  imbalance_and_activation:
    kind: rolling_lag
    lag_minutes: 0
  production_consumption_settlement:
    kind: rolling_lag
    lag_minutes: 4545
  wind_solar_forecasts.ForecastDayAhead:
    kind: daily_publication
    civil_time: "18:00"
    delivery_day_offset: -1
  wind_solar_forecasts.ForecastIntraday:
    kind: daily_publication
    civil_time: "06:00"
    delivery_day_offset: 0
  wind_solar_forecasts.Forecast5Hour:
    kind: rolling_lead
    lead_minutes: 300
  wind_solar_forecasts.Forecast1Hour:
    kind: rolling_lead
    lead_minutes: 60
  wind_solar_forecasts.ForecastCurrent:
    kind: rolling_lead
    lead_minutes: 0

aggregation:
  quarters_per_hour: 4
  sum_over_quarters: [aFRRUpMW, aFRRDownMW]
  keep_quarter_resolution: [DayAheadPriceEUR, ImbalancePriceEUR, SpotPriceEUR, aFRRVWAUpEUR, aFRRVWADownEUR]
  hourly_broadcast: [UpDemandMW, UpProcuredMW, UpPriceEUR, DownDemandMW, DownProcuredMW, DownPriceEUR]
  expected_units:
    aFRRUpMW: MWh
    aFRRDownMW: MWh
    UpPriceEUR: EUR per MW
    DayAheadPriceEUR: EUR per MWh

definition_changes:
  - dataset: imbalance_and_activation
    columns: [SatisfiedDemand, DominatingDirection]
    effective_utc: "2026-03-04 00:00:00"
    note: "Before 2026-03-04 SatisfiedDemand was mFRR balancing demand; from that date it is activated mFRR volume. DominatingDirection changed basis on the same date."

output:
  directory: p1_paper/results/s0_dk1_audit
  summary_json: summary.json
  findings_csv: findings.csv
  visibility_csv: visibility.csv
